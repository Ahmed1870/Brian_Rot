name: Render Lesson 21
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install
      - run: npm run typecheck
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: Lesson21_SQL-Scalar-Subqueries
          path: out/Lesson21_SQL-Scalar-Subqueries.mp4
