name: Render SQL Lesson 43 (Ahmed x Manzooma)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: render-main
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run render
      - name: Verify video exists
        run: test -s out/ahmed_sql_lesson43.mp4 && ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: ahmed_sql_lesson43
          path: out/ahmed_sql_lesson43.mp4
          if-no-files-found: error
