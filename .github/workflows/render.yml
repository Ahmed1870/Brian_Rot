name: Render Cracked Screen Reel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: cracked-screen-reel
          path: out/cracked-screen-reel.mp4
          if-no-files-found: error
          retention-days: 14
