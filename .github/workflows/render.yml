name: Render SQL Lesson 10 DML and RETURNING
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion render src/index.ts SQL-L10-DML-Returning out/sql-l10-dml-returning.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000
      - uses: actions/upload-artifact@v4
        with:
          name: sql-l10-dml-returning
          path: out/sql-l10-dml-returning.mp4
