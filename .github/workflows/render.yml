name: Render Lesson 1.5 (Ahmed x Monzoma)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx remotion render src/index.ts BrainRotViral out/ahmed_systems_L15.mp4 --codec h264 --concurrency 2
      - uses: actions/upload-artifact@v4
        with:
          name: ahmed_systems_L15
          path: out/ahmed_systems_L15.mp4
