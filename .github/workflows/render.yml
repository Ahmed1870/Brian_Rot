name: Render Lesson Video
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMP_ID: XL-L66-Scenario-Analysis
      OUT_NAME: xl-l66-scenario-analysis
    steps:
      - uses: actions/checkout@v4
      - name: Guard (names, voiceover, public)
        run: |
          set -e
          grep -q "COMP_ID = \"$COMP_ID\"" src/theme.ts || { echo "COMP_ID missing in theme.ts"; exit 1; }
          grep -q "$COMP_ID out/$OUT_NAME.mp4" package.json || { echo "package.json build mismatch"; exit 1; }
          test -s public/voiceover_lesson_66.mp3 || { echo "voiceover missing"; exit 1; }
          extra=$(ls public | grep -v -x -e voiceover_lesson_66.mp3 -e manzooma-logo.svg || true)
          [ -z "$extra" ] || { echo "extra files in public: $extra"; exit 1; }
          [ "$(ls .github/workflows | wc -l)" = "1" ] || { echo "more than one workflow"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system libs
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 ffmpeg
      - run: npm install
      - run: npx tsc --noEmit
      - name: Render
        run: |
          mkdir -p out
          npx remotion render src/index.ts $COMP_ID out/$OUT_NAME.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000 --concurrency=100%
      - run: test -s out/$OUT_NAME.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: xl-l66-scenario-analysis.mp4
          path: out/xl-l66-scenario-analysis.mp4
