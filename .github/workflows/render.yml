name: Render XL-L08-Conditional-Logic-IF-AND-OR
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: render-main
  cancel-in-progress: true
env:
  COMP_ID: XL-L08-Conditional-Logic-IF-AND-OR
  OUT_NAME: xl-l08-conditional-logic-if-and-or
  VOICE: voiceover_lesson_08.mp3
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard - names must match everywhere
        run: |
          set -euo pipefail
          grep -q "COMP_ID = '$COMP_ID'" src/theme.ts
          grep -q "OUT_NAME = '$OUT_NAME'" src/theme.ts
          grep -q "VOICE = '$VOICE'" src/theme.ts
          grep -q "remotion render src/index.ts $COMP_ID out/$OUT_NAME.mp4" package.json
          grep -q "id={COMP_ID}" src/Root.tsx
          test -s "public/$VOICE"
          test "$(ls .github/workflows | wc -l)" = "1"
          extra="$(find public -type f | grep -v -E '^public/(voiceover_lesson_08\.mp3|manzooma_logo\.svg|sfx/[a-z_]+\.wav)$' || true)"
          if [ -n "$extra" ]; then echo "Unexpected files in public:"; echo "$extra"; exit 1; fi
          stale="$(grep -rhoE 'XL-L[0-9]+' src package.json .github | sort -u | grep -v '^XL-L08$' || true)"
          if [ -n "$stale" ]; then echo "Stale lesson id: $stale"; exit 1; fi
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Verify video exists
        run: test -s "out/$OUT_NAME.mp4" && ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_NAME }}
          path: out/${{ env.OUT_NAME }}.mp4
          if-no-files-found: error
