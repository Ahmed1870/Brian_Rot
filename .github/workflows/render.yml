name: Render SQL Lesson 36 Recursive CTE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Guard - this repo must contain lesson 36 only
        run: |
          grep -q "SQL-L36-Recursive-CTE" src/theme.ts
          grep -q "SQL-L36-Recursive-CTE" package.json
          test -f public/voiceover_lesson_36.mp3
          test "$(ls public | wc -l)" = "1"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion render src/index.ts SQL-L36-Recursive-CTE out/sql-l36-recursive-cte.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000
      - run: test -s out/sql-l36-recursive-cte.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: sql-l36-recursive-cte
          path: out/sql-l36-recursive-cte.mp4
          if-no-files-found: error
