name: Render Lesson 10

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  COMP_ID: XL-L10-Error-Handling
  OUT_NAME: excel-l10-error-handling
  VOICE: voiceover_lesson_10.mp3
  LOGO: manzooma_logo.svg

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Guard (names must match before rendering)
        shell: bash
        run: |
          set -euo pipefail
          grep -q "COMP_ID = '${COMP_ID}'" src/theme.ts || { echo "theme.ts COMP_ID mismatch"; exit 1; }
          grep -q "XL-L10-Error-Handling" package.json || { echo "package.json COMP_ID mismatch"; exit 1; }
          grep -q "out/${OUT_NAME}.mp4" package.json || { echo "package.json output name mismatch"; exit 1; }
          test -s "public/${VOICE}" || { echo "voiceover missing"; exit 1; }
          test -s "public/${LOGO}" || { echo "logo missing"; exit 1; }
          extra=$(ls public | grep -v -x -e "${VOICE}" -e "${LOGO}" || true)
          [ -z "$extra" ] || { echo "unexpected files in public: $extra"; exit 1; }
          [ "$(ls .github/workflows | wc -l)" = "1" ] || { echo "more than one workflow file"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fonts (open Calibri substitute)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito

      - run: npm install --no-audit --no-fund

      - name: Render
        run: npx remotion render src/index.ts "${COMP_ID}" "out/${OUT_NAME}.mp4" --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000 --scale=2 --concurrency=4

      - name: Verify output
        run: test -s "out/${OUT_NAME}.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: excel-l10-error-handling
          path: out/excel-l10-error-handling.mp4
