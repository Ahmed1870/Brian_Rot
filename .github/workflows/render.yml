name: Render lesson video
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  COMP_ID: XL-L51-Query-Folding
  OUT_NAME: xl-l51-query-folding
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard (names must match everywhere)
        run: |
          set -euo pipefail
          grep -q "COMP_ID = \"$COMP_ID\"" src/theme.ts
          grep -q "OUT_NAME = \"$OUT_NAME\"" src/theme.ts
          grep -q "$COMP_ID" package.json
          grep -q "out/$OUT_NAME.mp4" package.json
          grep -q "COMP_ID" src/Root.tsx
          ! grep -q "XL-L" src/Root.tsx
          test -s public/voiceover_lesson_51.mp3
          extra=$(find public -type f ! -name 'voiceover_lesson_51.mp3' ! -name 'manzooma-logo-white.svg' | wc -l)
          test "$extra" -eq 0
          test "$(ls .github/workflows | wc -l)" -eq 1
      - name: System libraries for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Render
        run: npx remotion render src/index.ts "$COMP_ID" "out/$OUT_NAME.mp4" --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000
      - name: Verify output
        run: test -s "out/$OUT_NAME.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: xl-l51-query-folding
          path: out/xl-l51-query-folding.mp4
          if-no-files-found: error
