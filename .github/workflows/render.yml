name: Render video
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: Ahmed-SQL-L61
          path: out/*.mp4
          if-no-files-found: error
