name: Render Excel Lesson 09

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  COMP_ID: XL-L09-Aggregate-IFS-Functions
  OUT_NAME: excel-lesson-09-aggregate-ifs

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guard (names, voiceover, public contents)
        run: |
          set -e
          grep -q "COMP_ID = \"$COMP_ID\"" src/theme.ts
          grep -q "$COMP_ID" package.json
          grep -q "out/$OUT_NAME.mp4" package.json
          test -s public/voiceover_lesson_09.mp3
          test -s public/sfx_lesson_09.mp3
          test -s public/manzooma-logo.svg
          extra=$(ls public | grep -v -x -e voiceover_lesson_09.mp3 -e sfx_lesson_09.mp3 -e manzooma-logo.svg || true)
          if [ -n "$extra" ]; then echo "Unexpected files in public: $extra"; exit 1; fi
          test "$(ls .github/workflows | wc -l)" = "1"

      - name: Cache npm + Remotion browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules/.remotion
          key: remotion-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: System libs for headless Chrome
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libgbm-dev || true

      - run: npm install --no-audit --no-fund

      - name: Render
        run: npx remotion render src/index.ts $COMP_ID out/$OUT_NAME.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000

      - run: test -s out/$OUT_NAME.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: excel-lesson-09-aggregate-ifs
          path: out/excel-lesson-09-aggregate-ifs.mp4
          if-no-files-found: error
