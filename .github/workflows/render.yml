name: Render SQL Lesson 63 Full-Text Search
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Guard - this repo must contain lesson 63 only
        run: |
          grep -q "SQL-L63-Full-Text-Search" src/theme.ts
          grep -q "SQL-L63-Full-Text-Search" package.json
          test -f public/voiceover_lesson_63.mp3
          test "$(ls public | wc -l)" = "1"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion render src/index.ts SQL-L63-Full-Text-Search out/sql-l63-full-text-search.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000
      - run: test -s out/sql-l63-full-text-search.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: sql-l63-full-text-search
          path: out/sql-l63-full-text-search.mp4
          if-no-files-found: error
