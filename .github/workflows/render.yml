name: Render Lesson Video

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  COMP_ID: XL-L60-CALCULATE-FILTER
  OUT_NAME: xl-l60-calculate-filter

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard (names, voiceover, public)
        run: |
          set -e
          grep -q "$COMP_ID" src/theme.ts
          grep -q "$COMP_ID" package.json
          grep -q "$OUT_NAME" package.json
          test -s public/voiceover_lesson_60.mp3
          extra=$(ls public | grep -v -x -e voiceover_lesson_60.mp3 -e manzooma_logo.svg || true)
          if [ -n "$extra" ]; then echo "Unexpected files in public: $extra"; exit 1; fi
          test "$(ls .github/workflows | wc -l)" = "1"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Render
        run: npx remotion render src/index.ts XL-L60-CALCULATE-FILTER out/xl-l60-calculate-filter.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000
      - run: test -s out/xl-l60-calculate-filter.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: xl-l60-calculate-filter
          path: out/xl-l60-calculate-filter.mp4
