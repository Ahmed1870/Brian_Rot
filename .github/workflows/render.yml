name: Render BrainRotViral
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run generate-audio
      - run: npx remotion render src/index.ts BrainRotViral out/BrainRotViral.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: BrainRotViral
          path: out/BrainRotViral.mp4
