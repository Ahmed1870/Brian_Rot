name: Render SQL Lesson 12 ORDER BY LIMIT OFFSET
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion render src/index.ts SQL-L12-OrderBy-Limit-Offset out/sql-l12-orderby-limit-offset.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000
      - uses: actions/upload-artifact@v4
        with:
          name: sql-l12-orderby-limit-offset
          path: out/sql-l12-orderby-limit-offset.mp4
