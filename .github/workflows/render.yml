name: Render SQL Lesson 42 Window Framing
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Guard - this repo must contain lesson 42 only
        run: |
          grep -q "SQL-L42-Window-Framing" src/theme.ts
          grep -q "SQL-L42-Window-Framing" package.json
          test -f public/voiceover_lesson_42.mp3
          test "$(ls public | wc -l)" = "1"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion render src/index.ts SQL-L42-Window-Framing out/sql-l42-window-framing.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000
      - run: test -s out/sql-l42-window-framing.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: sql-l42-window-framing
          path: out/sql-l42-window-framing.mp4
          if-no-files-found: error
