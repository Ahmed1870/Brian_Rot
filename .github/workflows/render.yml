name: Render Excel Lesson 24 Flash Fill TextToColumns RemoveDuplicates
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Guard - this repo must contain Excel lesson 24 only
        run: |
          grep -q "XL-L24-FlashFill-TextToColumns-RemoveDuplicates" src/theme.ts
          grep -q "XL-L24-FlashFill-TextToColumns-RemoveDuplicates" package.json
          test -f public/voiceover_lesson_24.mp3
          test -f public/manzooma_logo.svg
          for n in click key tick pop whoosh chime; do test -f public/sfx_$n.mp3; done
          test "$(ls public | wc -l)" = "8"
          # Refuse to render if a lockfile got committed (would cause MODULE_NOT_FOUND on Linux)
          test ! -f package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (no lockfile, with retry)
        run: |
          rm -rf node_modules package-lock.json
          for i in 1 2 3; do
            if npm install --no-audit --no-fund --no-package-lock && node -e "require('@remotion/renderer'); require('@remotion/cli'); console.log('deps OK')"; then
              exit 0
            fi
            echo "install attempt $i failed, cleaning and retrying"; rm -rf node_modules; npm cache clean --force || true
          done
          echo "dependencies could not be installed correctly"; exit 1
      - run: npx remotion render src/index.ts XL-L24-FlashFill-TextToColumns-RemoveDuplicates out/xl-l24-flashfill-texttocolumns-removeduplicates.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000
      - run: test -s out/xl-l24-flashfill-texttocolumns-removeduplicates.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: xl-l24-flashfill-texttocolumns-removeduplicates
          path: out/xl-l24-flashfill-texttocolumns-removeduplicates.mp4
          if-no-files-found: error
