name: render-xl-l65-linear-regression-forecasting
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true
env:
  COMP_ID: XL-L65-Linear-Regression-Forecasting
  OUT_NAME: xl-l65-linear-regression-forecasting
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard (names, voiceover, public)
        run: |
          set -e
          grep -q "\"$COMP_ID\"" src/theme.ts || { echo "COMP_ID missing in theme.ts"; exit 1; }
          grep -q "$COMP_ID" package.json || { echo "COMP_ID missing in package.json"; exit 1; }
          test -s public/voiceover_lesson_65.mp3 || { echo "voiceover missing"; exit 1; }
          extra=$(ls public | grep -v -x -e voiceover_lesson_65.mp3 -e manzooma_logo.svg || true)
          [ -z "$extra" ] || { echo "extra files in public: $extra"; exit 1; }
          [ "$(ls .github/workflows | wc -l)" = "1" ] || { echo "more than one workflow"; exit 1; }
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Browser
        run: npx remotion browser ensure
      - name: Render
        run: npx remotion render src/index.ts $COMP_ID out/$OUT_NAME.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000
      - name: Verify output
        run: test -s out/$OUT_NAME.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: xl-l65-linear-regression-forecasting
          path: out/xl-l65-linear-regression-forecasting.mp4
          if-no-files-found: error
