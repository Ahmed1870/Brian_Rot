name: render

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      COMP_ID: XL-L12-INDEX-MATCH
      OUT_NAME: xl-l12-index-match
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard
        run: |
          set -e
          grep -q "COMP_ID = \"$COMP_ID\"" src/theme.ts
          grep -q "remotion render src/index.ts $COMP_ID out/$OUT_NAME.mp4" package.json
          test -s public/voiceover_lesson_12.mp3
          test -s public/manzooma_logo.svg
          for n in datacamp_tech_ambient typing_fast academic_outro_theme radar_lock free_pass_chime structural_shield_snap crosshair_laser matrix_value_snap speedometer_boost enterprise_index_match_seal; do test -s "public/$n.mp3"; done
          extra="$(ls public | grep -v -x -e voiceover_lesson_12.mp3 -e manzooma_logo.svg -e datacamp_tech_ambient.mp3 -e typing_fast.mp3 -e academic_outro_theme.mp3 -e radar_lock.mp3 -e free_pass_chime.mp3 -e structural_shield_snap.mp3 -e crosshair_laser.mp3 -e matrix_value_snap.mp3 -e speedometer_boost.mp3 -e enterprise_index_match_seal.mp3 || true)"
          test -z "$extra"
          test "$(ls .github/workflows | wc -l)" = "1"
      - run: npm install --no-audit --no-fund
      - run: npx remotion render src/index.ts $COMP_ID out/$OUT_NAME.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000 --scale=2
      - run: test -s out/$OUT_NAME.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: xl-l12-index-match.mp4
          path: out/xl-l12-index-match.mp4
