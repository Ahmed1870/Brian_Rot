name: Render Excel Lesson 46 Power Query ETL
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Guard - this repo must contain this lesson only
        run: |
          grep -q "XL-L46-PowerQuery-ETL" src/theme.ts
          grep -q "XL-L46-PowerQuery-ETL" package.json
          test -f public/voiceover_lesson_46.mp3
          test -f public/manzooma_logo.svg
          for n in click key tick pop whoosh chime error alert scan shine ambient; do test -f public/sfx_$n.mp3; done
          test "$(ls public | wc -l)" = "13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          rm -rf node_modules package-lock.json
          for i in 1 2 3; do
            if npm install --no-audit --no-fund --no-package-lock && node -e "require('@remotion/renderer'); require('@remotion/cli'); console.log('deps OK')"; then
              npm install --no-save --no-audit --no-fund --no-package-lock @remotion/compositor-linux-x64-gnu@4.0.250 || true
              exit 0
            fi
            echo "install attempt $i failed, cleaning and retrying"; rm -rf node_modules; npm cache clean --force || true
          done
          echo "dependencies could not be installed correctly"; exit 1
      - run: npx remotion render src/index.ts XL-L46-PowerQuery-ETL out/xl-l46-powerquery-etl.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000
      - run: test -s out/xl-l46-powerquery-etl.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: xl-l46-powerquery-etl
          path: out/xl-l46-powerquery-etl.mp4
          if-no-files-found: error
