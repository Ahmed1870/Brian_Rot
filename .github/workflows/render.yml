name: Render video
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run generate-audio
      - run: npx remotion render src/index.ts Monzoma-SQL-L07 out/Monzoma-SQL-L07.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Monzoma-SQL-L07
          path: out/*.mp4
          if-no-files-found: error
