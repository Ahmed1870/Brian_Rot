name: Render Lesson 55 — Isolation Levels & Concurrency Anomalies

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chromium system libraries
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2 libpango-1.0-0 libcairo2 || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate sound design
        run: npm run generate-audio

      - name: Render SQL-L55-IsolationLevels
        run: npx remotion render src/index.ts SQL-L55-IsolationLevels out/sql-l55-isolation-levels.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --concurrency=100% --timeout=180000

      - uses: actions/upload-artifact@v4
        with:
          name: sql-l55-isolation-levels
          path: out/sql-l55-isolation-levels.mp4
          retention-days: 14
