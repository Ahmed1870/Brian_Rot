name: Render XL-L14-XMATCH-2D-XLOOKUP
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: render-main
  cancel-in-progress: true
env:
  COMP_ID: XL-L14-XMATCH-2D-XLOOKUP
  OUT_NAME: xl-l14-xmatch-2d-xlookup
  VOICE: voiceover_lesson_14.mp3
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard - names must match everywhere
        run: |
          set -euo pipefail
          grep -q "COMP_ID = '$COMP_ID'" src/theme.ts
          grep -q "OUT_NAME = '$OUT_NAME'" src/theme.ts
          grep -q "VOICE = '$VOICE'" src/theme.ts
          grep -q "remotion render src/index.ts $COMP_ID out/$OUT_NAME.mp4" package.json
          grep -q "id={COMP_ID}" src/Root.tsx
          test -s "public/$VOICE"
          test "$(ls .github/workflows | wc -l)" = "1"
          extra="$(find public -type f | grep -v -E '^public/(voiceover_lesson_14\.mp3|manzooma_logo\.svg|soundtrack_lesson_14\.wav)$' || true)"
          if [ -n "$extra" ]; then echo "Unexpected files in public:"; echo "$extra"; exit 1; fi
          stale="$(grep -rhoE 'XL-L[0-9]+' src package.json .github | sort -u | grep -v '^XL-L14$' || true)"
          if [ -n "$stale" ]; then echo "Stale lesson id: $stale"; exit 1; fi
      - name: Install dependencies (no lockfile, Linux-native packages)
        run: |
          rm -rf node_modules package-lock.json
          for i in 1 2 3; do
            if npm install --no-audit --no-fund --no-package-lock && node -e "require('@remotion/renderer'); require('@remotion/cli'); console.log('deps OK')"; then
              npm install --no-save --no-audit --no-fund --no-package-lock @remotion/compositor-linux-x64-gnu@4.0.300 || true
              exit 0
            fi
            echo "install attempt $i failed, cleaning and retrying"; rm -rf node_modules; npm cache clean --force || true
          done
          echo "dependencies could not be installed correctly"; exit 1
      - run: npm run check
      - run: npm run build
      - name: Verify video exists
        run: test -s "out/$OUT_NAME.mp4" && ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_NAME }}
          path: out/${{ env.OUT_NAME }}.mp4
          if-no-files-found: error
