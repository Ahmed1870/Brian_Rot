name: Render PY-L05-VariablesTypes

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          set -e
          REMOTION_VERSION=4.0.250
          rm -rf node_modules package-lock.json
          ok=0
          for i in 1 2 3; do
            if npm install --no-audit --no-fund --no-package-lock && node -e "require('@remotion/renderer'); require('@remotion/cli')"; then
              ok=1
              break
            fi
            echo "install attempt $i failed - cleaning and retrying"
            rm -rf node_modules
            npm cache clean --force || true
          done
          if [ "$ok" != "1" ]; then
            echo "install failed after 3 attempts"
            exit 1
          fi
          npm install --no-save --no-audit --no-fund --no-package-lock @remotion/compositor-linux-x64-gnu@$REMOTION_VERSION || true

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Render
        run: |
          mkdir -p out
          npx remotion render src/index.ts PY-L05-VariablesTypes out/py-l05-variablestypes.mp4 --codec=h264 --concurrency=100% --image-format=jpeg --jpeg-quality=85 --crf=22 --x264-preset=veryfast

      - name: Inspect output
        run: |
          ls -la out
          npx remotion ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of default=nw=1 out/py-l05-variablestypes.mp4 || true

      - uses: actions/upload-artifact@v4
        with:
          name: PY-L05-VariablesTypes
          path: out/py-l05-variablestypes.mp4
          retention-days: 14
