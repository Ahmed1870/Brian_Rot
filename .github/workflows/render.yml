name: Render lesson video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system libraries for Chromium (best effort)
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2t64 libatk-bridge2.0-0t64 || true
      - run: npm install
      - run: npm run generate-audio
      # The composition ID and output file name (lesson number + title) live in package.json -> "render"
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-video
          path: out/*.mp4
