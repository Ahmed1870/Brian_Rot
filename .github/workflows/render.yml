name: Render lesson video
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard (names, voiceover, public)
        run: |
          set -e
          grep -q "XL-L42-LAMBDA-MAP" src/theme.ts || { echo "COMP_ID missing in theme.ts"; exit 1; }
          grep -q "XL-L42-LAMBDA-MAP" package.json || { echo "COMP_ID missing in package.json"; exit 1; }
          grep -q "xl-l42-lambda-map.mp4" package.json || { echo "output name missing in package.json"; exit 1; }
          test -s public/voiceover_lesson_42.mp3 || { echo "voiceover missing"; exit 1; }
          extra=$(ls public | grep -vxE "voiceover_lesson_42.mp3|manzooma_logo.svg" || true)
          [ -z "$extra" ] || { echo "extra files in public: $extra"; exit 1; }
          [ "$(ls .github/workflows | wc -l)" = "1" ] || { echo "more than one workflow"; exit 1; }
      - name: Install
        run: |
          rm -rf node_modules package-lock.json
          for i in 1 2 3; do
            if npm install --no-audit --no-fund --no-package-lock && node -e "require('@remotion/renderer'); require('@remotion/cli'); console.log('deps OK')"; then
              npm install --no-save --no-audit --no-fund --no-package-lock @remotion/compositor-linux-x64-gnu@4.0.250 || true
              exit 0
            fi
            echo "install attempt $i failed, cleaning and retrying"; rm -rf node_modules; npm cache clean --force || true
          done
          echo "dependencies could not be installed correctly"; exit 1
      - name: Render
        run: npx remotion render src/index.ts XL-L42-LAMBDA-MAP out/xl-l42-lambda-map.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000
      - name: Check output
        run: test -s out/xl-l42-lambda-map.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: xl-l42-lambda-map
          path: out/xl-l42-lambda-map.mp4
