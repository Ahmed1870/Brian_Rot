name: Render Excel Lesson 15 Dynamic Arrays Spill
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Guard - this repo must contain Excel lesson 15 only
        run: |
          grep -q "XL-L15-Dynamic-Arrays-Spill" src/theme.ts
          grep -q "XL-L15-Dynamic-Arrays-Spill" package.json
          test -f public/voiceover_lesson_15.mp3
          test -f public/manzooma_logo.svg
          for n in click key tick pop whoosh chime; do test -f public/sfx_$n.mp3; done
          test "$(ls public | wc -l)" = "8"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion render src/index.ts XL-L15-Dynamic-Arrays-Spill out/xl-l15-dynamic-arrays-spill.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=180000
      - run: test -s out/xl-l15-dynamic-arrays-spill.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: xl-l15-dynamic-arrays-spill
          path: out/xl-l15-dynamic-arrays-spill.mp4
          if-no-files-found: error
