name: Render RFM lesson 24
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run generate-audio
      - run: npx remotion render src/index.ts BrainRotViral out/rfm-lesson-24.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --timeout=240000
      - uses: actions/upload-artifact@v4
        with:
          name: rfm-lesson-24
          path: out/rfm-lesson-24.mp4
